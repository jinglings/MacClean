<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F8F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#040D0C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<meta property="og:site_name" content="MacClean">
<meta property="og:image" content="https://thulem.com/assets/img/icon-512.png">
<link rel="stylesheet" href="/assets/css/site.css?v=1.4">
<script>
  (function () {
    var d = document.documentElement, l = null;
    d.className += ' js';
    try { l = localStorage.getItem('mc.lang'); } catch (e) {}
    if (l !== 'zh' && l !== 'en') l = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
    d.lang = l === 'zh' ? 'zh-CN' : 'en';
    if (l === 'en') { d.className += ' i18n-pending'; setTimeout(function () { d.classList.remove('i18n-pending'); }, 1500); }
  })();
</script>
